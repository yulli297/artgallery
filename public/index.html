<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>우리 반 가상 미술관</title>
<style>
:root{--bg:#f4efe6;--ink:#2b2622;--muted:#6f655b;--line:#d9cfc0;--card:#fffdf9;--accent:#8a5a2b;--accent2:#1d7a62;--danger:#a33a2c}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 14px}
button:hover{border-color:var(--accent)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button.green{background:var(--accent2);border-color:var(--accent2);color:#fff}
button.ghost{background:transparent}
button.danger{color:var(--danger);border-color:#e2b8b0}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;color:var(--ink);width:100%}
textarea{resize:vertical;min-height:64px}
label.f{display:block;font-size:14px;color:var(--muted);margin:12px 0 6px}
.hidden{display:none!important}
.screen{position:fixed;inset:0}
/* 로그인 */
#login{display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#fbf6ec,#efe5d4)}
.lbox{width:min(560px,92vw);background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 32px;box-shadow:0 12px 40px rgba(80,60,30,.12)}
.lbox h1{margin:0 0 4px;font-size:28px;letter-spacing:-.5px}
.lbox .sub{color:var(--muted);margin:0 0 18px;font-size:15px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.classes{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.classes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.row{display:flex;gap:10px}
.row>*{flex:1}
.msg{min-height:22px;color:var(--danger);font-size:14px;margin-top:10px}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.5}
/* 앱 */
#view{position:absolute;inset:0;touch-action:none}
#view canvas{display:block}
.hud-top{position:absolute;left:12px;right:12px;top:10px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
.hud-top>*{pointer-events:auto}
.titlebox{background:rgba(255,253,249,.92);border:1px solid var(--line);border-radius:12px;padding:8px 14px;max-width:46vw}
.titlebox b{display:block;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titlebox span{font-size:13px;color:var(--muted)}
.badge{display:inline-block;font-size:12px;padding:2px 8px;border-radius:20px;background:#efe3cf;color:#6b4520;margin-left:6px;vertical-align:middle}
.badge.v{background:#d9efe7;color:#145c49}
.btns{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.btns button{background:rgba(255,253,249,.94);padding:8px 12px;font-size:15px}
.btns button.primary{background:var(--accent);color:#fff}
.btns button.dirty::after{content:" ●";color:#ffd27a}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;pointer-events:none;opacity:.6}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#aim{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:rgba(43,38,34,.82);color:#fff;padding:8px 16px;border-radius:20px;font-size:15px;pointer-events:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#help{position:absolute;right:12px;bottom:14px;font-size:12px;color:#fff;background:rgba(43,38,34,.55);padding:6px 10px;border-radius:8px;pointer-events:none;line-height:1.5;text-align:right}
#joy{position:absolute;left:24px;bottom:24px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.22);border:2px solid rgba(255,255,255,.55);touch-action:none}
#knob{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.8);box-shadow:0 2px 6px rgba(0,0,0,.25)}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);text-align:center;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.6);pointer-events:none;transition:opacity 1s}
#banner h2{font-size:34px;margin:0 0 8px}#banner p{margin:0;font-size:17px}
/* 모달 */
#modal{position:fixed;inset:0;background:rgba(30,24,18,.5);display:flex;align-items:center;justify-content:center;z-index:20}
#modal .box{position:relative;width:min(900px,94vw);max-height:90vh;overflow:auto;background:var(--card);border-radius:18px;padding:22px 26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
#modal .box.narrow{width:min(520px,94vw)}
#modal .x{position:absolute;right:14px;top:12px;border:none;background:none;font-size:26px;padding:2px 8px;color:var(--muted)}
#modal h3{margin:0 0 12px;font-size:21px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px;margin-top:10px}
.card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;text-align:left;padding:0}
.card img{display:block;width:100%;height:100px;object-fit:cover;background:#eee}
.card div{padding:6px 8px;font-size:13px;line-height:1.35}
.card small{color:var(--muted)}
.card.on{outline:3px solid var(--accent)}
.sel{display:flex;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);align-items:flex-start}
.sel img{width:220px;max-height:200px;object-fit:contain;background:#f3efe8;border-radius:10px}
.sel .info{flex:1}
.bigimg{display:block;max-width:100%;max-height:58vh;margin:0 auto 12px;border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.15)}
.layouts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.layouts button{text-align:left;padding:10px;font-size:14px;line-height:1.4}
.layouts button b{display:block;font-size:15px;margin-bottom:2px}
.layouts button.on{border:2px solid var(--accent);background:#fbf3e6}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:44px;height:44px;border-radius:50%;padding:0;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 3px var(--accent)}
.list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.item{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff}
.item .t{flex:1;line-height:1.4}
.item .t small{color:var(--muted)}
.comments{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.cm{padding:8px 0;border-bottom:1px dashed var(--line);display:flex;gap:8px;align-items:flex-start}
.cm .t{flex:1}.cm b{font-size:14px}.cm button{padding:2px 8px;font-size:12px}
.switch{display:flex;align-items:center;gap:10px;font-size:16px}
.warn{background:#fdf1e2;border:1px solid #efc98f;color:#7a4b12;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.5;margin-bottom:10px}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:20px;z-index:30;font-size:15px;opacity:0;transition:opacity .3s;pointer-events:none}
#loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:18px;background:rgba(30,24,18,.35);pointer-events:none}
.descbox{background:#f6efe3;padding:10px 12px;border-radius:10px;margin-top:10px;line-height:1.6}
.upbox{background:#f6efe3;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6;margin-bottom:6px}
.tcbar{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.tcbar input{padding:7px 10px}
table.tc{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
table.tc th{text-align:left;color:var(--muted);font-weight:500;border-bottom:1px solid var(--line);padding:6px}
table.tc td{border-bottom:1px solid #eee5d8;padding:6px;vertical-align:middle}
table.tc td.pin{font-family:Consolas,monospace;font-size:18px;letter-spacing:2px;font-weight:600}
table.tc td.acts{text-align:right;white-space:nowrap}
table.tc td.acts button{padding:4px 9px;font-size:13px;margin-left:4px}
.tabs button{white-space:nowrap}
@media (max-width:820px){.layouts{grid-template-columns:repeat(2,1fr)}.sel{flex-direction:column}.sel img{width:100%}}
</style>
</head>
<body>

<!-- ===== 로그인 화면 ===== -->
<div id="login" class="screen">
  <div class="lbox">
    <h1>우리 반 가상 미술관</h1>
    <p class="sub">명화 10점과 내 그림으로 나만의 전시관을 꾸며 보세요.</p>
    <div class="tabs"><button id="tabS" class="on">학생</button><button id="tabT">선생님</button></div>
    <label class="f">반</label>
    <div class="classes" id="classBtns"></div>
    <div id="formS">
      <div class="row">
        <div><label class="f">번호</label><select id="lgNum"></select></div>
        <div><label class="f">비밀번호 (숫자 4자리)</label><input id="lgPin" type="password" inputmode="numeric" maxlength="4" autocomplete="off"></div>
      </div>
      <div id="newBox" class="hidden">
        <div class="note" style="color:var(--accent2)">처음 들어왔어요! 내 이름을 적고 다시 입장하기를 눌러 주세요.</div>
        <label class="f">이름</label><input id="lgName" maxlength="10">
      </div>
      <div class="note">비밀번호는 선생님께 받은 종이에 적혀 있어요.</div>
      <button class="primary" id="lgGo" style="width:100%;margin-top:12px;padding:12px">입장하기</button>
    </div>
    <div id="formT" class="hidden">
      <label class="f">교사 비밀번호</label><input id="lgTpw" type="password" autocomplete="off">
      <button class="primary" id="lgTGo" style="width:100%;margin-top:16px;padding:12px">선생님으로 입장</button>
    </div>
    <div class="msg" id="lgMsg"></div>
  </div>
</div>

<!-- ===== 전시관 화면 ===== -->
<div id="app" class="screen hidden">
  <div id="view"></div>
  <div id="cross"></div>
  <div class="hud-top">
    <div class="titlebox"><b id="hTitle"></b><span id="hSub"></span></div>
    <div class="btns" id="hBtns"></div>
  </div>
  <div id="aim" class="hidden"></div>
  <div id="help">WASD·방향키: 이동 &nbsp;|&nbsp; 드래그: 둘러보기<br>작품 누르기: 크게 보기 / 바꾸기</div>
  <div id="joy" class="hidden"><div id="knob"></div></div>
  <div id="banner" style="opacity:0"><h2 id="bnT"></h2><p id="bnP"></p></div>
  <div id="loading" class="hidden">불러오는 중…</div>
</div>

<div id="modal" class="hidden"><div class="box" id="mbox"><button class="x" id="mx" aria-label="닫기">×</button><div id="mbody"></div></div></div>
<div id="toast"></div>

<script src="/vendor/three.min.js"></script>
<script>
'use strict';
/* ================= 기본 도우미 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const S = { token: null, me: null, cfg: null, catalog: null, view: null, g: null, dirty: false, pending: null, pendingMeta: null, classSel: null };
let store = null; try { store = window.localStorage; } catch (e) { store = null; }
function saveSess() { try { store && store.setItem('vg_sess', JSON.stringify({ token: S.token, me: S.me })); } catch (e) {} }
function loadSess() { try { return JSON.parse(store && store.getItem('vg_sess')); } catch (e) { return null; } }
function clearSess() { try { store && store.removeItem('vg_sess'); } catch (e) {} }

async function api(method, url, body) {
  const headers = {};
  if (body) headers['Content-Type'] = 'application/json';
  if (S.token) headers.Authorization = 'Bearer ' + S.token;
  let r;
  try { r = await fetch(url, { method, headers, body: body ? JSON.stringify(body) : undefined }); }
  catch (e) { throw new Error('서버에 연결할 수 없어요. 인터넷을 확인해 주세요.'); }
  let j = {}; try { j = await r.json(); } catch (e) {}
  if (r.status === 401 && S.token) { logout(true); throw new Error(j.error || '다시 로그인해 주세요.'); }
  if (!r.ok) throw new Error(j.error || '문제가 생겼어요.');
  return j;
}
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.opacity = 1; clearTimeout(toastT); toastT = setTimeout(() => t.style.opacity = 0, 2600); }
function loading(on) { $('#loading').classList.toggle('hidden', !on); }

/* ================= 전시관 구조 (방마다 명화 10점 + 내 그림 1점) =================
   벽: [x1,z1,x2,z2, 안쪽방향x,z, 명화 개수, 벽 없음(1), 두께]  */
const R8 = 7;
function octLayout() {
  const walls = [], cnt = [2, 0, 2, 2, 1, 'S', 1, 2]; let door = null;
  for (let i = 0; i < 8; i++) {
    const a1 = (22.5 + 45 * i) * Math.PI / 180, a2 = (22.5 + 45 * (i + 1)) * Math.PI / 180;
    const x1 = R8 * Math.cos(a1), z1 = R8 * Math.sin(a1), x2 = R8 * Math.cos(a2), z2 = R8 * Math.sin(a2);
    const mx = (x1 + x2) / 2, mz = (z1 + z2) / 2, ml = Math.hypot(mx, mz), nx = -mx / ml, nz = -mz / ml;
    if (i === 1) {
      const f = 0.36, ax = x1 + (x2 - x1) * f, az = z1 + (z2 - z1) * f, bx = x2 + (x1 - x2) * f, bz = z2 + (z1 - z2) * f;
      walls.push([x1, z1, ax, az, nx, nz, 0]); walls.push([bx, bz, x2, z2, nx, nz, 0]); door = [ax, az, bx, bz];
    } else walls.push([x1, z1, x2, z2, nx, nz, cnt[i] === 'S' ? 0 : cnt[i]]);
  }
  const zf = R8 * Math.cos(Math.PI / 8);
  return { name: '팔각 홀', desc: '둥근 방 가운데 의자에 앉아 빙 둘러보는 구조. 입구 정면에 내 그림.', oct: true, walls, door,
    stu: [0, -zf, 0, 1], eye: [0, zf - 1.3], look: [0, -6], benches: [], round: true, mats: [[0, zf + 0.6, 0]] };
}
const LAYOUTS = {
  corridor: { name: '긴 복도형', desc: '양쪽 벽의 명화를 지나 걸어가면 끝 벽에 내 그림이 기다려요.',
    floors: [[0, 0, 6, 24]],
    walls: [[0, 0, 6, 0, 0, 1, 0], [0, 0, 0, 24, 1, 0, 5], [6, 0, 6, 24, -1, 0, 5], [0, 24, 2, 24, 0, -1, 0], [4, 24, 6, 24, 0, -1, 0]],
    door: [2, 24, 4, 24], stu: [3, 0, 0, 1], eye: [3, 22.6], look: [3, 0], benches: [[3, 8, 1], [3, 16, 1]], mats: [[3, 24.6, 0]] },
  ell: { name: 'ㄱ자 2개 방', desc: '첫 방은 명화관, 꺾어 들어간 두 번째 방 끝 벽에 내 그림.',
    floors: [[0, 0, 14, 10], [4, 10, 14, 24]],
    walls: [[0, 0, 14, 0, 0, 1, 2], [0, 0, 0, 3.5, 1, 0, 0], [0, 6.5, 0, 10, 1, 0, 0], [0, 10, 8, 10, 0, -1, 1], [11, 10, 14, 10, 0, -1, 0],
      [14, 0, 14, 10, -1, 0, 1], [14, 10, 14, 24, -1, 0, 3], [4, 10, 4, 24, 1, 0, 3], [4, 24, 14, 24, 0, -1, 0]],
    door: [0, 3.5, 0, 6.5], stu: [9, 24, 0, -1], eye: [1.2, 5], look: [14, 5], benches: [[7.5, 5, 1], [9, 17, 0]], mats: [[-0.6, 5, 1]] },
  oct: octLayout(),
  partition: { name: '가벽 전시실', desc: '방 가운데 가벽을 돌아가면 뒷면에서 내 그림이 나타나요.',
    floors: [[0, 0, 12, 14]],
    walls: [[0, 0, 12, 0, 0, 1, 2], [0, 0, 0, 14, 1, 0, 3], [12, 0, 12, 14, -1, 0, 3], [0, 14, 4.5, 14, 0, -1, 0], [7.5, 14, 12, 14, 0, -1, 0],
      [3.5, 6, 8.5, 6, 0, 1, 2, 0, 0.3], [3.5, 6, 8.5, 6, 0, -1, 0, 1, 0.3]],
    door: [4.5, 14, 7.5, 14], stu: [6, 6, 0, -1, 0.3], eye: [6, 12.8], look: [6, 6], benches: [[6, 2.6, 0], [6, 10, 0]], mats: [[6, 14.6, 0]] }
};
const LAYOUT_ORDER = ['corridor', 'ell', 'oct', 'partition'];
const WALLS = [{ c: 0xf6f3ec, n: '흰색' }, { c: 0xd8d6d0, n: '연회색' }, { c: 0x2f3e5c, n: '남색' }, { c: 0x6e2b35, n: '버건디' }, { c: 0x5f6b4e, n: '올리브' }];
const FLOORS = [{ c: 0xb98b5e, n: '밝은 원목' }, { c: 0x6e4b32, n: '진한 원목' }, { c: 0x9a9890, n: '회색 돌' }];
const hex = c => '#' + c.toString(16).padStart(6, '0');
const defaultG = () => ({ layout: 'ell', wall: 0, floor: 0, galleryName: '', intro: '', frames: Array(10).fill(null), painting: null });

/* ================= 3D 장면 ================= */
let renderer, scene, camera, world = null, slots = [], colWalls = [], colBoxes = [], colCircles = [];
const texCache = new Map();
let needRender = true;
const invalidate = () => { needRender = true; };
const P = { x: 0, z: 0, yaw: 0, pitch: 0 };
const keys = {};
const joy = { x: 0, y: 0 };
const EYE = 1.6, RAD = 0.35;

function init3D() {
  if (renderer) return;
  const el = $('#view');
  renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(el.clientWidth, el.clientHeight);
  el.appendChild(renderer.domElement);
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2b2622);
  camera = new THREE.PerspectiveCamera(65, el.clientWidth / el.clientHeight, 0.05, 100);
  camera.rotation.order = 'YXZ';
  scene.add(new THREE.HemisphereLight(0xffffff, 0x7a6e60, 0.62));
  scene.add(new THREE.AmbientLight(0xffffff, 0.2));
  const dl = new THREE.DirectionalLight(0xffffff, 0.3); dl.position.set(4, 10, 6); scene.add(dl);
  window.addEventListener('resize', () => {
    renderer.setSize(el.clientWidth, el.clientHeight);
    camera.aspect = el.clientWidth / el.clientHeight; camera.updateProjectionMatrix(); invalidate();
  });
  setupControls();
  let last = performance.now(), aimT = 0, lastKey = '';
  (function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (S.view) { move(dt); aimT += dt; if (aimT > 0.2) { aimT = 0; updateAim(); } }
    // 움직이거나 그림이 바뀔 때만 다시 그림 (가만히 있을 때 태블릿 발열·배터리 절약)
    const key = P.x.toFixed(3) + ',' + P.z.toFixed(3) + ',' + P.yaw.toFixed(4) + ',' + P.pitch.toFixed(4);
    if (needRender || key !== lastKey) {
      camera.position.set(P.x, EYE, P.z); camera.rotation.set(P.pitch, P.yaw, 0);
      renderer.render(scene, camera); lastKey = key; needRender = false;
    }
    requestAnimationFrame(loop);
  })(last);
}

function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
let phM = null, phS = null;
function placeholderTex(stu) {
  if (stu && phS) return phS; if (!stu && phM) return phM;
  const t = canvasTex(320, 240, (g, w, h) => {
    g.fillStyle = stu ? '#fbf7ee' : '#f2efe9'; g.fillRect(0, 0, w, h);

    const r = j.getBoundingClientRect(); let dx = cx - (r.left + r.width / 2), dy = cy - (r.top + r.height / 2);
    const d = Math.hypot(dx, dy), m = 48; if (d > m) { dx = dx / d * m; dy = dy / d * m; }
    kn.style.transform = `translate(${dx}px,${dy}px)`; joy.x = dx / m; joy.y = dy / m;
  };
  j.addEventListener('pointerdown', e => { jid = e.pointerId; j.setPointerCapture(jid); jset(e.clientX, e.clientY); e.stopPropagation(); });
  j.addEventListener('pointermove', e => { if (e.pointerId === jid) jset(e.clientX, e.clientY); });
  const jend = e => { if (e.pointerId !== jid) return; jid = null; joy.x = joy.y = 0; kn.style.transform = ''; };
  j.addEventListener('pointerup', jend); j.addEventListener('pointercancel', jend);
}

/* 그림 파일 줄이기 (긴 변 maxSide px, 용량 maxLen 이하) */
function compress(file, maxSide, maxLen) {
  return new Promise((ok, no) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > maxSide) { const k = maxSide / Math.max(w, h); w = Math.round(w * k); h = Math.round(h * k); }
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
      let q = 0.82, d = c.toDataURL('image/jpeg', q);
      while (d.length > maxLen && q > 0.4) { q -= 0.1; d = c.toDataURL('image/jpeg', q); }
      URL.revokeObjectURL(url); ok(d);
    };
    img.onerror = () => { URL.revokeObjectURL(url); no(new Error('이 그림 파일은 열 수 없어요. jpg나 png로 올려 주세요.')); };
    img.src = url;
  });
}

/* ================= 저장 ================= */
function markDirty() { S.dirty = true; renderHud(); }
const cleanObj = o => { if (!o) return null; const c = {}; for (const k in o) if (k[0] !== '_') c[k] = o[k]; return c; };
async function save() {
  if (!S.view || !S.view.own) return;
  if (!S.dirty) { toast('바뀐 내용이 없어요. 이미 저장되어 있어요.'); return; } // 같은 내용은 다시 보내지 않음
  const b = $('#bSave'); if (b) b.disabled = true;
  try {
    const g = S.g;
    // 1) 새로 고른 그림 파일만 먼저 올리기 (Firebase Storage)
    const total = g.frames.filter(f => f && f._data).length + (S.pending ? 1 : 0); let n = 0;
    for (const f of g.frames) {
      if (!f || f.src !== 'up' || !f._data) continue;
      toast(`그림 올리는 중… (${++n}/${total})`);
      const r = await api('POST', '/api/upload', { data: f._data });
      f.path = r.path; f.url = r.url; delete f._data;
    }
    let painting = null;
    if (S.pending) {
      toast(`그림 올리는 중… (${++n}/${total})`);
      const r = await api('POST', '/api/upload', { data: S.pending.data });
      painting = { path: r.path, url: r.url, title: S.pending.title, desc: S.pending.desc };
    } else if (S.pendingMeta) painting = S.pendingMeta;
    // 2) 전시관 정보 저장 (요청 1번)
    const r = await api('PUT', '/api/save', { layout: g.layout, wall: g.wall, floor: g.floor, galleryName: g.galleryName, intro: g.intro, frames: g.frames.map(cleanObj), painting });
    const tex = S.pending ? S.pending.tex : (g.painting && g.painting._tex);
    g.painting = r.gallery.painting; if (g.painting && tex) g.painting._tex = tex;
    r.gallery.frames.forEach((f, i) => { if (!f) g.frames[i] = null; });
    S.pending = null; S.pendingMeta = null; S.dirty = false; renderHud(); slots.forEach(applySlot); toast('저장했어요!');
  } catch (e) { toast(e.message); }
  if ($('#bSave')) $('#bSave').disabled = false;
}
window.addEventListener('beforeunload', e => { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });

/* ================= 화면 위쪽 ================= */
function renderHud() {
  const v = S.view, g = S.g, me = S.me;
  if (v) {
    $('#hTitle').textContent = (g.galleryName ? `‘${g.galleryName}’` : `${v.name}의 전시관`);
    $('#hSub').innerHTML = `${esc(v.name)}${g.galleryName ? '의 전시관' : ''} <span class="badge ${v.own ? '' : 'v'}">${v.own ? '꾸미는 중' : '구경 중'}</span>`;
  } else { $('#hTitle').textContent = me.role === 'teacher' ? `${className(me.classId)} 선생님` : ''; $('#hSub').textContent = '학생 전시관을 골라 구경하세요'; }
  const B = [];
  if (v && v.own) { B.push(`<button id="bSet">⚙ 설정</button>`); B.push(`<button id="bSave" class="primary${S.dirty ? ' dirty' : ''}">저장</button>`); }
  if (v && !v.own && me.role === 'student') B.push(`<button id="bHome">🏠 내 전시관</button>`);
  B.push(`<button id="bFriends">${me.role === 'teacher' ? '학생 전시관' : '친구 전시관'}</button>`);
  if (me.role === 'teacher') B.push(`<button id="bTeacher">관리</button>`);
  B.push(`<button id="bOut" class="ghost">나가기</button>`);
  $('#hBtns').innerHTML = B.join('');
  const on = (id, f) => { const e = $('#' + id); if (e) e.onclick = f; };
  on('bSet', () => openSettings(false)); on('bSave', save);
  on('bHome', () => leaveThen(() => loadGallery(me.classId, me.num, true)));
  on('bFriends', openFriends); on('bTeacher', openTeacher);
  on('bOut', () => { if (S.dirty && !confirm('저장하지 않은 내용이 있어요. 그래도 나갈까요?')) return; logout(); });
}
const className = id => { const c = S.cfg.classes.find(x => x.id === id); return c ? c.name : id; };
function showBanner() {
  const g = S.g, v = S.view, bn = $('#banner');
  $('#bnT').textContent = g.galleryName ? `‘${g.galleryName}’` : `${v.name}의 전시관`;
  $('#bnP').textContent = g.intro || (v.own ? '빈 액자를 눌러 작품을 걸어 보세요' : `${v.name}의 전시관에 오신 것을 환영해요`);
  bn.style.transition = 'none'; bn.style.opacity = 1;
  setTimeout(() => { bn.style.transition = 'opacity 1.2s'; bn.style.opacity = 0; }, 2600);
}

/* ================= 전시관 불러오기 ================= */
function leaveThen(fn) {
  if (S.dirty && S.view && S.view.own) {
    if (confirm('저장하지 않은 내용이 있어요. 저장하고 이동할까요?\n(취소를 누르면 저장하지 않고 이동해요)')) { save().then(fn); return; }
    S.dirty = false; S.pending = null; S.pendingMeta = null;
  }
  fn();
}
async function loadGallery(cid, num, own) {
  loading(true);
  try {
    const r = await api('GET', `/api/gallery/${cid}/${num}`);
    S.view = { cid, num, own, name: own ? S.me.name : r.name };
    S.g = Object.assign(defaultG(), r.gallery || {});
    if (!Array.isArray(S.g.frames)) S.g.frames = Array(10).fill(null);
    S.pending = null; S.pendingMeta = null; S.dirty = false;
    buildScene(); spawn(); renderHud(); closeModal();
    if (own && !r.gallery) openSettings(true); else showBanner();
    if (!own && !r.gallery) toast('아직 꾸미지 않은 전시관이에요.');
  } catch (e) { toast(e.message); }
  loading(false);
}

/* ================= 친구 전시관 ================= */
const LNAME = k => (LAYOUTS[k] ? LAYOUTS[k].name : '');
async function openFriends() {
  const me = S.me;
  openModal(`<h3>${className(me.classId)} 전시관</h3><div id="frBody" class="note">불러오는 중…</div>`, true);
  try {
    const r = await api('GET', '/api/class/' + me.classId);
    if (!r.open && me.role !== 'teacher') { $('#frBody').innerHTML = '아직 전시가 열리지 않았어요.<br>선생님이 전시를 열면 친구들의 전시관을 구경할 수 있어요.'; return; }
    const list = r.students.filter(s => s.saved);
    if (!list.length) { $('#frBody').textContent = '아직 저장된 전시관이 없어요.'; return; }
    $('#frBody').className = 'list';
    $('#frBody').innerHTML = list.map(s => `<div class="item"><div class="t"><b>${s.num}번 ${esc(s.name)}</b>${me.role === 'student' && s.num === me.num ? ' <span class="badge">나</span>' : ''}<br>
      <small>${s.galleryName ? '‘' + esc(s.galleryName) + '’ · ' : ''}${esc(LNAME(s.layout))} · 명화 ${s.count}점 · 내 그림 ${s.hasPainting ? '있음' : '없음'}</small></div>
      <button data-n="${s.num}">구경하기</button></div>`).join('');
    $('#frBody').querySelectorAll('button[data-n]').forEach(b => b.onclick = () => {
      const n = +b.dataset.n, own = me.role === 'student' && n === me.num;
      leaveThen(() => loadGallery(me.classId, n, own));
    });
  } catch (e) { $('#frBody').textContent = e.message; }
}

/* ================= 교사 관리 ================= */
async function openTeacher() {
  const me = S.me;
  openModal(`<h3>${className(me.classId)} 관리</h3><div id="tcBody" class="note">불러오는 중…</div>`);
  try {
    const r = await api('GET', '/api/class/' + me.classId);
    const warns = [];
    if (S.cfg.storage === 'local') warns.push('지금은 <b>임시 저장소</b>를 쓰고 있어요. 서버가 다시 켜지면 학생 작품과 비밀번호가 지워질 수 있어요. 실제 수업 전에 Firebase를 연결해 주세요(README 참고).');
    else if (S.cfg.images === 'local') warns.push('Firebase <b>Storage</b>를 찾지 못해 학생이 올린 그림을 임시 폴더에 저장하고 있어요. README를 보고 Storage를 켜 주세요.');
    const size = r.size || r.students.length || 25, hasPin = r.students.some(s => s.pin);
    $('#tcBody').className = '';
    $('#tcBody').innerHTML = `${warns.map(w => `<div class="warn">${w}</div>`).join('')}
      <div class="tcbar">
        <div class="switch"><b>전시</b><button id="tcOpen" class="${r.open ? 'green' : ''}">${r.open ? '열려 있음 (닫기)' : '닫혀 있음 (열기)'}</button></div>
        <div class="switch"><b>학생 수</b><input id="tcSize" type="number" min="1" max="${S.cfg.maxStudents}" value="${size}" style="width:76px">
          <button id="tcMake">비밀번호 만들기</button><button id="tcPrint" class="primary"${hasPin ? '' : ' disabled'}>비밀번호 인쇄</button></div>
      </div>
      <div class="note">전시를 열면 학생들이 친구 전시관을 구경하고 감상평을 남길 수 있어요. '비밀번호 만들기'는 아직 비밀번호가 없는 번호에만 새로 만들어요.</div>
      ${r.students.length ? `<table class="tc"><thead><tr><th>번호</th><th>이름</th><th>비밀번호</th><th>전시관</th><th></th></tr></thead><tbody>${r.students.map(s => `<tr>
        <td>${s.num}</td><td>${s.name ? esc(s.name) : '<span class="note">첫 로그인 때 입력</span>'}</td>
        <td class="pin">${s.pin || '-'}</td>
        <td><small>${s.saved ? `${s.galleryName ? '‘' + esc(s.galleryName) + '’ · ' : ''}명화 ${s.count}점 · 내 그림 ${s.hasPainting ? '있음' : '없음'}` : '아직 저장 안 함'}</small></td>
        <td class="acts">${s.saved ? `<button data-v="${s.num}">구경</button>` : ''}<button data-n="${s.num}">이름</button><button class="danger" data-p="${s.num}">새 비밀번호</button></td></tr>`).join('')}</tbody></table>`
        : '<div class="note" style="margin-top:14px;font-size:15px">학생 수를 적고 <b>비밀번호 만들기</b>를 누르면 번호마다 숫자 4자리 비밀번호가 만들어져요. 그다음 <b>비밀번호 인쇄</b>로 잘라서 나눠 주세요.</div>'}`;
    const mb = $('#tcBody');
    $('#tcOpen').onclick = async () => { try { await api('POST', '/api/teacher/open', { open: !r.open }); toast(!r.open ? '전시를 열었어요.' : '전시를 닫았어요.'); openTeacher(); } catch (e) { toast(e.message); } };
    $('#tcMake').onclick = async () => {
      const n = +$('#tcSize').value;
      if (!(n >= 1 && n <= S.cfg.maxStudents)) { toast(`학생 수는 1~${S.cfg.maxStudents} 사이로 적어 주세요.`); return; }
      try { await api('POST', '/api/teacher/pins', { size: n }); toast('비밀번호를 만들었어요.'); openTeacher(); } catch (e) { toast(e.message); }
    };
    $('#tcPrint').onclick = () => printPins(r.students.filter(s => s.pin));
    mb.querySelectorAll('[data-v]').forEach(b => b.onclick = () => loadGallery(me.classId, +b.dataset.v, false));
    mb.querySelectorAll('[data-n]').forEach(b => b.onclick = async () => {
      const s = r.students.find(x => x.num === +b.dataset.n);
      const nm = prompt(`${s.num}번 학생 이름`, s.name || ''); if (nm == null) return;
      try { await api('POST', '/api/teacher/name', { num: s.num, name: nm }); openTeacher(); } catch (e) { toast(e.message); }
    });
    mb.querySelectorAll('[data-p]').forEach(b => b.onclick = async () => {
      if (!confirm(`${b.dataset.p}번 학생의 비밀번호를 새로 만들까요?\n이전 비밀번호로는 더 이상 들어올 수 없어요. 작품은 그대로 남아요.`)) return;
      try { const x = await api('POST', '/api/teacher/resetpin', { num: +b.dataset.p }); toast(`${b.dataset.p}번 새 비밀번호: ${x.pin}`); openTeacher(); } catch (e) { toast(e.message); }
    });
  } catch (e) { $('#tcBody').textContent = e.message; }
}
// 비밀번호 쪽지 인쇄 (점선대로 잘라서 나눠 주기)
function printPins(list) {
  if (!list.length) { toast('먼저 비밀번호를 만들어 주세요.'); return; }
  const w = window.open('', '_blank');
  if (!w) { toast('팝업이 막혀 있어요. 브라우저에서 팝업을 허용해 주세요.'); return; }
  const cls = className(S.me.classId), url = location.origin;
  w.document.write(`<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><title>${esc(cls)} 가상 미술관 비밀번호</title><style>
    body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;margin:8mm;color:#222}
    h2{font-size:15pt;margin:0 0 1mm}.u{font-size:10pt;color:#555;margin-bottom:4mm}
    .g{display:grid;grid-template-columns:repeat(3,1fr)}
    .c{border:1px dashed #999;padding:4mm 5mm;height:34mm;box-sizing:border-box;page-break-inside:avoid}
    .c .t{font-size:9pt;color:#666}.c .n{font-size:14pt;font-weight:700;margin-top:1mm}
    .c .p{font-size:26pt;letter-spacing:3mm;font-weight:700;margin-top:1mm;font-family:Consolas,monospace}
    .c .a{font-size:8pt;color:#777;word-break:break-all}
    .noprint{margin-bottom:5mm;font-size:11pt}.noprint button{font-size:12pt;padding:4px 14px}
    @media print{.noprint{display:none}}
  </style></head><body>
  <div class="noprint"><button onclick="print()">인쇄하기</button> 점선을 따라 잘라서 나눠 주세요.</div>
  <h2>${esc(cls)} 우리 반 가상 미술관</h2><div class="u">접속 주소: ${esc(url)}</div>
  <div class="g">${list.map(s => `<div class="c"><div class="t">${esc(cls)} 가상 미술관</div><div class="n">${s.num}번 ${esc(s.name || '')}</div><div class="p">${s.pin}</div><div class="a">${esc(url)}</div></div>`).join('')}</div>
  <script>setTimeout(function(){print()},500)<\/script></body></html>`);
  w.document.close();
}

/* ================= 로그인 ================= */
function renderLogin() {
  const cls = S.cfg.classes;
  $('#classBtns').innerHTML = cls.map(c => `<button data-c="${c.id}">${esc(c.name.replace(/^\d+학년 /, ''))}</button>`).join('');
  $('#classBtns').querySelectorAll('button').forEach(b => b.onclick = () => { S.classSel = b.dataset.c; $('#classBtns').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); $('#lgMsg').textContent = ''; });
  $('#lgNum').innerHTML = Array.from({ length: S.cfg.maxStudents }, (_, i) => `<option value="${i + 1}">${i + 1}번</option>`).join('');
  $('#tabS').onclick = () => { $('#tabS').classList.add('on'); $('#tabT').classList.remove('on'); $('#formS').classList.remove('hidden'); $('#formT').classList.add('hidden'); $('#lgMsg').textContent = ''; };
  $('#tabT').onclick = () => { $('#tabT').classList.add('on'); $('#tabS').classList.remove('on'); $('#formT').classList.remove('hidden'); $('#formS').classList.add('hidden'); $('#lgMsg').textContent = ''; };
  $('#lgNum').onchange = () => { $('#newBox').classList.add('hidden'); };
  $('#lgGo').onclick = loginStudent; $('#lgTGo').onclick = loginTeacher;
  ['#lgPin', '#lgName'].forEach(s => $(s).addEventListener('keydown', e => { if (e.key === 'Enter') loginStudent(); }));
  $('#lgTpw').addEventListener('keydown', e => { if (e.key === 'Enter') loginTeacher(); });
}
async function loginStudent() {
  const msg = $('#lgMsg'); msg.textContent = '';
  if (!S.classSel) { msg.textContent = '반을 먼저 골라 주세요.'; return; }
  const pin = $('#lgPin').value.trim();
  if (!/^\d{4}$/.test(pin)) { msg.textContent = '비밀번호는 숫자 4자리예요.'; return; }
  const isNew = !$('#newBox').classList.contains('hidden');
  const body = { classId: S.classSel, num: +$('#lgNum').value, pin };
  if (isNew) {
    const name = $('#lgName').value.trim();
    if (!name) { msg.textContent = '이름을 적어 주세요.'; return; }
    body.name = name;
  }
  $('#lgGo').disabled = true;
  try {
    const r = await api('POST', '/api/login', body);
    if (r.needName) { $('#newBox').classList.remove('hidden'); $('#lgName').focus(); $('#lgGo').disabled = false; return; }
    S.token = r.token; S.me = r.me; saveSess(); await enter();
  } catch (e) { msg.textContent = e.message; }
  $('#lgGo').disabled = false;
}
async function loginTeacher() {
  const msg = $('#lgMsg'); msg.textContent = '';
  if (!S.classSel) { msg.textContent = '반을 먼저 골라 주세요.'; return; }
  $('#lgTGo').disabled = true;
  try {
    const r = await api('POST', '/api/teacher/login', { classId: S.classSel, password: $('#lgTpw').value });
    S.token = r.token; S.me = r.me; saveSess(); await enter();
  } catch (e) { msg.textContent = e.message; }
  $('#lgTGo').disabled = false;
}
async function enter() {
  $('#login').classList.add('hidden'); $('#app').classList.remove('hidden');
  init3D();
  if (S.me.role === 'student') await loadGallery(S.me.classId, S.me.num, true);
  else {
    S.view = null; S.g = defaultG(); buildScene(); spawn(); renderHud(); openTeacher();
  }
}
function logout(silent) {
  S.token = null; S.me = null; S.view = null; S.dirty = false; S.pending = null; S.pendingMeta = null; clearSess();
  closeModal(); $('#app').classList.add('hidden'); $('#login').classList.remove('hidden');
  $('#lgPin').value = ''; $('#lgName').value = ''; $('#lgTpw').value = ''; $('#newBox').classList.add('hidden');
  if (silent) $('#lgMsg').textContent = '다시 로그인해 주세요.';
}

(async function init() {
  try { S.cfg = await api('GET', '/api/config'); }
  catch (e) { $('#lgMsg').textContent = e.message; return; }
  renderLogin();
  const s = loadSess();
  if (s && s.token && s.me) { S.token = s.token; S.me = s.me; try { await enter(); } catch (e) { logout(true); } }
})();
</script>
</body>
</html>
